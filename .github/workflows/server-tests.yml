name: server-tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halotasks-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: halotasks-server/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.test.json --noEmit
      # Full suite, including api.routes and treeAward.realmongo, which start a real mongod via MongoMemoryServer.
      - run: npx vitest run
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halotasks-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: halotasks-client/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
